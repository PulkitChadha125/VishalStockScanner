<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#05070d">
  <title>{% block title %}Trading App{% endblock %} · Vishal Terminal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  {% block extra_head %}{% endblock %}
</head>
<body data-page="{{ active_page }}">
  <div class="drawer-overlay" id="drawer-overlay" aria-hidden="true"></div>
  <div class="layout">
    <aside class="drawer" id="app-drawer">
      <div class="drawer__brand">
        <span class="drawer__logo" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="32" height="32">
            <defs>
              <linearGradient id="brand-grad" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#22d3ee"/>
                <stop offset="1" stop-color="#a78bfa"/>
              </linearGradient>
            </defs>
            <path d="M16 2 29 9.5v13L16 30 3 22.5v-13Z" fill="none" stroke="url(#brand-grad)" stroke-width="1.6"/>
            <path d="M9 19.5 13.5 14l3.5 3.5L23 10.5" fill="none" stroke="url(#brand-grad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="23" cy="10.5" r="1.8" fill="#22d3ee"/>
          </svg>
        </span>
        <span class="drawer__brand-text">
          <span class="drawer__title">Vishal Terminal</span>
          <span class="drawer__tagline">Depth · VWAP · Execution</span>
        </span>
      </div>

      <p class="drawer__section-label">Control</p>
      <nav class="drawer__nav" aria-label="Main navigation">
        <a href="{{ url_for('pages.symbol_settings') }}"
           class="drawer__link{% if active_page == 'symbols' %} is-active{% endif %}"
           data-log-label="Nav: Symbol Settings">
          <svg class="drawer__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>
          Symbol Settings
        </a>
        <a href="{{ url_for('pages.scanner_settings') }}"
           class="drawer__link{% if active_page == 'scanner' %} is-active{% endif %}"
           data-log-label="Nav: Scanner">
          <svg class="drawer__icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><path d="M12 12 18.5 5.5"/><circle cx="12" cy="12" r="1" /></svg>
          Scanner
        </a>
        <a href="{{ url_for('pages.order_logs') }}"
           class="drawer__link{% if active_page == 'orders' %} is-active{% endif %}"
           data-log-label="Nav: Order Logs">
          <svg class="drawer__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3v4M7 17v4M17 5v3M17 16v4"/><rect x="5" y="7" width="4" height="10" rx="1"/><rect x="15" y="8" width="4" height="8" rx="1"/></svg>
          Order Logs
        </a>
        <a href="{{ url_for('pages.app_logs') }}"
           class="drawer__link{% if active_page == 'app_logs' %} is-active{% endif %}"
           data-log-label="Nav: App Logs">
          <svg class="drawer__icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m7 9 3 3-3 3M13 15h4"/></svg>
          App Logs
        </a>
      </nav>

      <div class="drawer__footer">
        <div class="clock" aria-live="off">
          <span class="clock__label">IST</span>
          <span class="clock__time" id="ui-clock">--:--:--</span>
          <span class="clock__date" id="ui-date">—</span>
        </div>
      </div>
    </aside>

    <div class="layout__main">
      <button type="button" class="drawer-toggle" id="drawer-toggle" aria-label="Toggle menu">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <div class="app">
        {% block content %}{% endblock %}
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" hidden></div>
  <script src="{{ url_for('static', filename='js/ui.js') }}"></script>
  <script src="{{ url_for('static', filename='js/app-logger.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
